<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}｜商业系统实验室{% else %}商业系统实验室｜许明良 Seth Hsu{% endif %}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="https://sethhsu.com/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="https://sethhsu.com/og.jpg">
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% elsif page.sample %}<meta name="robots" content="noindex">{% endif %}
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css?v=20261016">
  <link rel="stylesheet" href="/assets/research-update.css?v=20261016">
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <main>
    {% include header.html current=page.nav %}
    <div id="content" tabindex="-1">
      {{ content }}
    </div>
    {% include footer.html %}
  </main>
  <script src="/assets/site.js?v=20261016"></script>
</body>
</html>
